<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b0f14">
<title>eNote</title>
<style>
/* ============ 设计 token：亮色为默认，html[data-theme=dark] 覆盖 ============ */
:root{
  --bg:#f5f7fb; --card:#ffffff; --card2:#f1f4f9; --line:rgba(16,24,40,.10);
  --fg:#131a24; --dim:#5c6878; --dim2:#8a94a3;
  --acc:#2f6bff; --acc2:#0fae88; --warn:#c77700; --bad:#e0453a; --ok:#0fae88; --tag:#7a5af0;
  --acc-s:rgba(47,107,255,.10); --acc2-s:rgba(15,174,136,.10);
  --warn-s:rgba(199,119,0,.12); --bad-s:rgba(224,69,58,.10); --tag-s:rgba(122,90,240,.10);
  --grad:linear-gradient(135deg,#2f6bff,#0fae88);
  --grad-text:linear-gradient(90deg,#2f6bff,#0fae88);
  --on-grad:#ffffff;
  --header-bg:rgba(245,247,251,.86); --nav-bg:rgba(255,255,255,.92);
  --toast-bg:#131a24; --toast-fg:#ffffff;
  --pre-bg:#f1f4f9; --pre-fg:#2a3a52; --thumb-bg:#eef1f6; --grip:#c9d1de;
  --r:16px; --sh:0 6px 22px rgba(16,24,40,.07);
  /* 动画 token：全应用只用这三个时长（R10） */
  --d1:110ms; --d2:180ms; --d3:280ms; --ease:cubic-bezier(.2,.8,.2,1);
}
html[data-theme=dark]{
  --bg:#0b0f14; --card:#151b23; --card2:#1b232d; --line:rgba(255,255,255,.07);
  --fg:#e8eef6; --dim:#8b98a9; --dim2:#5f6b7a;
  --acc:#6c9cff; --acc2:#39d0a3; --warn:#ffb454; --bad:#ff6b6b; --ok:#39d0a3; --tag:#c8b6ff;
  --acc-s:rgba(108,156,255,.12); --acc2-s:rgba(57,208,163,.12);
  --warn-s:rgba(255,180,84,.12); --bad-s:rgba(255,107,107,.12); --tag-s:rgba(200,182,255,.12);
  --grad:linear-gradient(135deg,#6c9cff,#39d0a3);
  --grad-text:linear-gradient(90deg,#8ab4ff,#39d0a3);
  --on-grad:#06121f;
  --header-bg:rgba(13,19,27,.86); --nav-bg:rgba(13,19,27,.94);
  --toast-bg:#22303f; --toast-fg:#ffffff;
  --pre-bg:#0a0e13; --pre-fg:#9fd0ff; --thumb-bg:#000000; --grip:#39424f;
  --sh:0 6px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--fg);
  font:15px/1.55 -apple-system,"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;
  transition:background var(--d2) var(--ease),color var(--d2) var(--ease)}
body{padding-bottom:calc(168px + env(safe-area-inset-bottom));overscroll-behavior:none}
a{color:var(--acc)}
.sec{margin:14px 2px 8px;font-size:12px;font-weight:700;color:var(--dim);letter-spacing:1px;
  display:flex;align-items:center;gap:8px}
.sec:after{content:"";flex:1;height:1px;background:var(--line)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:13px 14px;margin:10px 0;box-shadow:var(--sh)}
.row{display:flex;align-items:center;gap:8px}
.between{justify-content:space-between}
.t{font-size:16px;font-weight:700;margin:0 0 4px}
.meta{font-size:11px;color:var(--dim2);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.body{font-size:14px;color:var(--dim);white-space:pre-wrap;word-break:break-word;margin-top:6px}
.body.clamp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.chip{font-size:10px;padding:2px 7px;border-radius:999px;border:1px solid var(--line);
  color:var(--dim);background:var(--card2);white-space:nowrap}
.chip.ai{color:var(--acc);border-color:var(--acc);background:var(--acc-s)}
.chip.img{color:var(--acc2);border-color:var(--acc2);background:var(--acc2-s)}
.chip.pend{color:var(--warn);border-color:var(--warn);background:var(--warn-s)}
.chip.err{color:var(--bad);border-color:var(--bad);background:var(--bad-s)}
.chip.tag{color:var(--tag);border-color:var(--tag);background:var(--tag-s)}
/* 搜索命中来源（R3）：图片文字单独配色，因为它不是用户写的 */
.hits{display:flex;flex-wrap:wrap;gap:5px;margin:7px 0 0}
.hit{font-size:10px;padding:2px 8px;border-radius:999px;background:var(--acc-s);color:var(--acc);
  border:1px solid var(--acc);animation:hitin var(--d2) var(--ease) both}
.hit.img{background:var(--acc2-s);color:var(--acc2);border-color:var(--acc2)}
@keyframes hitin{from{opacity:0;transform:translateY(-4px) scale(.9)}to{opacity:1;transform:none}}
/* 附件网格（R4）：图片给缩略图，其他文件给类型图标 */
.agrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:2px}
.acard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:9px;
  box-shadow:var(--sh);display:flex;flex-direction:column;gap:5px;cursor:pointer;
  transition:transform var(--d1) var(--ease)}
.acard:active{transform:scale(.97)}
.acard.gone{opacity:.62}
.athumb{width:100%;height:96px;object-fit:contain;border-radius:10px;background:var(--card2)}
.aglyph{height:96px;display:flex;align-items:center;justify-content:center;font-size:38px;
  border-radius:10px;background:var(--card2)}
.aname{font-size:12.5px;font-weight:600;word-break:break-all;line-height:1.35}
.ameta{font-size:10.5px;color:var(--dim2)}
.anote{font-size:10.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amiss{font-size:10.5px;color:var(--bad)}
.arow{display:flex;gap:6px;margin-top:2px}
.arow .btn{flex:1}
.err{margin-top:8px;font-size:12px;color:var(--bad);background:var(--bad-s);
  border:1px solid var(--bad);border-radius:10px;padding:7px 9px}
.todo{display:flex;align-items:flex-start;gap:10px;padding:9px 2px;border-top:1px solid var(--line)}
.todo:first-child{border-top:0}
.cb{flex:0 0 22px;height:22px;margin-top:1px;border-radius:7px;border:1.6px solid var(--dim2);
  background:transparent;display:flex;align-items:center;justify-content:center;
  font-size:14px;color:transparent;transition:all var(--d1) var(--ease);cursor:pointer}
.cb.on{background:var(--acc2);border-color:var(--acc2);color:var(--on-grad)}
.tx{flex:1;font-size:14.5px}
.tx small{display:block;color:var(--dim2);font-size:11px;margin-top:2px}
.todo.done .tx{color:var(--dim2);text-decoration:line-through}
.pri-high{border-left:3px solid var(--bad);padding-left:8px}
.pri-low{opacity:.85}
.due{font-size:11px;padding:1px 6px;border-radius:6px;background:var(--acc-s);color:var(--acc)}
.due.over{background:var(--bad-s);color:var(--bad)}
.due.today{background:var(--acc2-s);color:var(--acc2)}
.thumb{width:100%;max-height:230px;object-fit:contain;border-radius:12px;margin-top:8px;
  border:1px solid var(--line);background:var(--thumb-bg)}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.btn{border:1px solid var(--line);background:var(--card2);color:var(--fg);
  border-radius:10px;padding:7px 12px;font-size:13px;font-weight:600;
  transition:transform var(--d1) var(--ease),opacity var(--d1) var(--ease)}
.btn:active{transform:scale(.95)}
.btn.pri{background:var(--grad);color:var(--on-grad);border:0}
.btn.gh{background:none;color:var(--dim)}
.btn.dg{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:4px 9px;font-size:12px}
input,textarea,select{width:100%;background:var(--card2);border:1px solid var(--line);
  border-radius:11px;color:var(--fg);padding:10px 12px;font-size:15px;font-family:inherit}
textarea{min-height:110px;resize:vertical}
label{display:block;font-size:11px;color:var(--dim);margin:12px 0 5px;font-weight:600;letter-spacing:.5px}
.empty{text-align:center;color:var(--dim2);padding:56px 20px;font-size:14px}
.empty div{font-size:44px;margin-bottom:10px;opacity:.6}
.sheet{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.5);display:none;
  align-items:flex-end;justify-content:center}
.sheet.on{display:flex}
.sheet .panel{width:100%;max-width:760px;max-height:88vh;overflow:auto;background:var(--card);
  border-radius:20px 20px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom));
  border-top:1px solid var(--line);animation:up var(--d2) var(--ease)}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
.grip{width:38px;height:4px;border-radius:2px;background:var(--grip);margin:0 auto 12px}
h2{font-size:17px;margin:0 0 4px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
.kv span:first-child{color:var(--dim)}
.kv span:last-child{text-align:right;word-break:break-all;color:var(--acc)}
pre{background:var(--pre-bg);border:1px solid var(--line);border-radius:10px;padding:10px;
  font-size:11px;overflow:auto;max-height:260px;color:var(--pre-fg);white-space:pre-wrap;word-break:break-word}
#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);
  background:var(--toast-bg);color:var(--toast-fg);padding:10px 16px;border-radius:12px;font-size:13px;
  box-shadow:var(--sh);opacity:0;transition:opacity var(--d2) var(--ease),transform var(--d2) var(--ease);
  pointer-events:none;z-index:60;max-width:86vw}
#toast.on{opacity:1;transform:translateX(-50%) translateY(-4px)}
.spin{display:inline-block;width:12px;height:12px;border:2px solid var(--line);
  border-top-color:var(--acc);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;
  background:var(--acc-s);color:var(--acc);font-size:12px;font-weight:600;border:1px solid var(--acc)}
.sw{position:relative;width:46px;height:26px;flex:0 0 46px;border-radius:999px;background:var(--grip);transition:background var(--d2) var(--ease)}
.sw:after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left var(--d2) var(--ease)}
.sw.on{background:var(--acc2)}.sw.on:after{left:23px}
/* 分段控件（主题切换等） */
.seg{display:flex;gap:4px;background:var(--card2);border:1px solid var(--line);
  border-radius:12px;padding:4px}
.seg button{flex:1;border:0;background:none;color:var(--dim);padding:8px 6px;border-radius:9px;
  font-size:13px;font-weight:600;transition:background var(--d1) var(--ease),color var(--d1) var(--ease),transform var(--d1) var(--ease)}
.seg button.on{background:var(--card);color:var(--fg);box-shadow:var(--sh)}
.seg button:active{transform:scale(.95)}
/* 主题切换时整页交叉淡入（R10） */
html.theming body{opacity:.6;transition:opacity var(--d1) var(--ease)}

/* ==================== 组件库（R10）====================
   顶栏 / 搜索 / 图标按钮 / 底部导航 / FAB / 卡片 / 列表项 / 空状态 / 骨架屏 /
   按钮涟漪 / 分段控件 / 开关 / 面板 / 轻提示；动画只用 --d1 --d2 --d3 --ease */

/* --- 顶栏（笔记/待办/附件 共用，R3/R6）--- */
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;
  padding:calc(8px + env(safe-area-inset-top)) 10px 8px;
  background:var(--header-bg);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.iconbtn{flex:0 0 38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--card);
  display:flex;align-items:center;justify-content:center;font-size:17px;color:var(--fg);position:relative;
  box-shadow:var(--sh);overflow:hidden;
  transition:transform var(--d1) var(--ease),background var(--d1) var(--ease)}
.iconbtn:active{transform:scale(.9)}
.iconbtn .dot{position:absolute;right:5px;top:5px;width:7px;height:7px;border-radius:50%;background:var(--ok)}
.iconbtn .dot.bad{background:var(--bad)}
.search{flex:1;display:flex;align-items:center;gap:6px;height:38px;padding:0 10px;
  background:var(--card);border:1px solid var(--line);border-radius:19px;box-shadow:var(--sh);
  transition:border-color var(--d1) var(--ease),box-shadow var(--d1) var(--ease)}
.search:focus-within{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-s)}
.search .sico{font-size:14px;opacity:.6;flex:0 0 auto}
.search input{flex:1;min-width:0;border:0;background:none;color:var(--fg);font-size:14px;padding:0;outline:none}
.search .sclr{border:0;background:var(--card2);color:var(--dim);width:20px;height:20px;border-radius:50%;
  font-size:11px;display:none;align-items:center;justify-content:center;flex:0 0 auto}
.search.has .sclr{display:flex}

/* --- 页内小统计条 --- */
.strip{display:flex;align-items:center;gap:8px;margin:10px 2px 0;padding:9px 12px;border-radius:12px;
  background:var(--card);border:1px solid var(--line);font-size:12px;color:var(--dim);box-shadow:var(--sh)}
.strip b{color:var(--acc2)}.strip i{color:var(--bad);font-style:normal}
.strip .sp{flex:1}

/* --- 底部导航（四页 + 滑动指示条，R2a）--- */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;
  padding:6px 8px calc(6px + env(safe-area-inset-bottom));
  background:var(--nav-bg);backdrop-filter:blur(16px);border-top:1px solid var(--line)}
.tabbar .tab{flex:1;position:relative;background:none;border:0;color:var(--dim);font-size:11px;
  padding:6px 0 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:600;
  overflow:hidden;border-radius:12px;transition:color var(--d2) var(--ease)}
.tabbar .tab .ti{font-size:20px;filter:grayscale(1);opacity:.6;transition:filter var(--d2) var(--ease),
  opacity var(--d2) var(--ease),transform var(--d2) var(--ease)}
.tabbar .tab em{font-style:normal}
.tabbar .tab.on{color:var(--acc)}
.tabbar .tab.on .ti{filter:none;opacity:1;transform:translateY(-2px) scale(1.08)}
.tabbar .tab:active{transform:scale(.94)}
.tabbar .ind{position:absolute;top:0;height:3px;border-radius:0 0 3px 3px;background:var(--grad);
  transition:transform var(--d2) var(--ease),width var(--d2) var(--ease);will-change:transform,width}

/* --- 圆角矩形 FAB（R2b）--- */
.fab{position:fixed;right:16px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:29;
  display:flex;align-items:center;gap:7px;padding:0 18px;height:50px;border:0;border-radius:16px;
  background:var(--grad);color:var(--on-grad);font-size:15px;font-weight:700;overflow:hidden;
  box-shadow:0 8px 22px var(--acc-s);animation:fabin var(--d3) var(--ease) both;
  transition:transform var(--d1) var(--ease),box-shadow var(--d1) var(--ease)}
.fab .fico{font-size:20px;line-height:1;transition:transform var(--d2) var(--ease)}
.fab:active{transform:scale(.93) rotate(-4deg)}
.fab:active .fico{transform:rotate(90deg)}
.fab.hide{display:none}
@keyframes fabin{from{transform:translateY(16px) scale(.9);opacity:0}to{transform:none;opacity:1}}

/* --- 卡片入场（只在切页/首次渲染时逐张浮现，最多 8 张错峰）--- */
@keyframes rise{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
main.enter .card,main.enter .acard{animation:rise var(--d2) var(--ease) both;animation-delay:calc(var(--i,0) * 24ms)}
main.enter .card:nth-child(n+9),main.enter .acard:nth-child(n+9){animation-delay:0ms}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
main.enter{animation:fadein var(--d2) var(--ease)}

/* --- 按钮涟漪（R10）--- */
.rip{position:absolute;border-radius:50%;background:currentColor;opacity:.18;transform:scale(0);
  animation:rip var(--d3) var(--ease) forwards;pointer-events:none}
@keyframes rip{to{transform:scale(2.6);opacity:0}}
.btn{position:relative;overflow:hidden}

/* --- 列表项 / 骨架屏 / 空状态 --- */
.li{display:flex;align-items:center;gap:10px;padding:11px 2px;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li:active{background:var(--card2)}
.skel{border-radius:10px;background:linear-gradient(90deg,var(--card2) 25%,var(--card) 37%,var(--card2) 63%);
  background-size:400% 100%;animation:shim 1.2s var(--ease) infinite}
@keyframes shim{from{background-position:100% 0}to{background-position:0 0}}
.skel.l{height:14px;margin:8px 0}.skel.s{height:10px;width:45%}.skel.img{height:120px;margin:10px 0}
.empty .em{font-size:44px;margin-bottom:10px;opacity:.6;animation:bob 2.6s var(--ease) infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}

/* --- 面板（底部弹出，带弹性）--- */
.sheet .panel{animation:up var(--d2) cubic-bezier(.2,1.08,.28,1)}
@keyframes up{from{transform:translateY(40px) scale(.98);opacity:.5}to{transform:none;opacity:1}}
.sheet .panel.full{max-height:94vh;height:94vh;border-radius:22px 22px 0 0}
.sheet.closing .panel{animation:down var(--d1) var(--ease) forwards}
@keyframes down{to{transform:translateY(30px);opacity:0}}

/* --- 开关 / 勾选动画 --- */
.cb{animation:none}
.cb.on{animation:pop var(--d2) var(--ease)}
@keyframes pop{0%{transform:scale(.7)}60%{transform:scale(1.15)}100%{transform:scale(1)}}

/* --- 我的页头部（R6）--- */
.hero{position:relative;overflow:hidden;border-radius:20px;padding:20px 18px 18px;margin:14px 0 10px;
  background:var(--grad);color:var(--on-grad);box-shadow:var(--sh)}
main.enter .hero{animation:rise var(--d3) var(--ease) both}
.hero h1{margin:0;font-size:24px;font-weight:800;letter-spacing:.5px}
.hero p{margin:4px 0 0;font-size:12px;opacity:.85}
.hero .ring{position:absolute;right:-30px;top:-40px;width:150px;height:150px;border-radius:50%;
  background:rgba(255,255,255,.14)}
.hero .ring2{position:absolute;right:14px;top:44px;width:60px;height:60px;border-radius:50%;
  background:rgba(255,255,255,.12)}
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 8px;text-align:center;
  box-shadow:var(--sh)}
main.enter .stat{animation:rise var(--d2) var(--ease) both;animation-delay:calc(var(--i,0)*30ms)}
.stat b{display:block;font-size:20px;background:var(--grad-text);-webkit-background-clip:text;
  background-clip:text;color:transparent;font-weight:800}
.stat span{font-size:11px;color:var(--dim)}

@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<!-- 顶栏：笔记 / 待办 / 附件 共用（R3、R6）；我的页用自己的 hero 头部 -->
<header class="topbar" id="topbar">
  <button class="iconbtn" id="brandBtn" aria-label="我的"><span>🎼</span><span class="dot" id="dot"></span></button>
  <div class="search" id="searchBox">
    <span class="sico">🔍</span>
    <input id="q" type="search" placeholder="搜索笔记与待办" autocomplete="off">
    <button class="sclr" id="qClear" aria-label="清除">✕</button>
  </div>
  <button class="iconbtn" id="sortBtn" aria-label="排序与筛选"><span>⇅</span></button>
</header>
<main id="view"></main>
<button class="fab" id="fab"><span class="fico">＋</span><span class="flabel">记一笔</span></button>
<nav class="tabbar" id="tabbar">
  <span class="ind" id="ind"></span>
  <button class="tab on" data-tab="notes"><span class="ti">📝</span><em>笔记</em></button>
  <button class="tab" data-tab="todos"><span class="ti">✅</span><em>待办</em></button>
  <button class="tab" data-tab="files"><span class="ti">📎</span><em>附件</em></button>
  <button class="tab" data-tab="mine"><span class="ti">👤</span><em>我的</em></button>
</nav>
<div class="sheet" id="sheet"><div class="panel" id="panel"></div></div>
<div id="toast"></div>
<script>
var S = {notes:[], settings:{}, info:{}};
var tab = 'notes', open = {}, busy = {};
var curTheme = '';
var q = '';
/* 每个页签自己的搜索/排序/筛选条件（P3 会持久化到服务端） */
var prefs = {
  notes:{sort:'new', src:'all', status:'all'},
  todos:{sort:'due', done:'open', pri:'all'},
  files:{sort:'new', kind:'all'}
};
function P(){ return prefs[tab] || prefs.notes }

/* ---------- 服务端搜索（R3）----------
   列表数据一律来自 /api/search；请求失败时退回本地过滤，断网也能看。 */
var SR = {notes:null, todoIds:null, where:{}, total:0, scanned:0};
var searchSeq = 0, prefsLoaded = false;
var PREF_KEYS = ['src','status','done','pri','kind','file'];
function prefPayload(){
  var p = P(), f = {};
  PREF_KEYS.forEach(function(k){ if(p[k] && p[k]!=='all') f[k]=p[k] });
  return {tab:tab, q:q, sort:p.sort||'new', dir:p.dir||'', filters:f};
}
function prefQS(){
  var d = prefPayload(), s = 'tab='+d.tab+'&q='+encodeURIComponent(d.q)+'&sort='+encodeURIComponent(d.sort);
  if(d.dir) s += '&dir='+encodeURIComponent(d.dir);
  Object.keys(d.filters).forEach(function(k){ s += '&'+k+'='+encodeURIComponent(d.filters[k]) });
  return s;
}
function flattenPrefs(u){
  var out = {};
  Object.keys(u||{}).forEach(function(k){
    var v = u[k]||{}, p = {q:v.q||'', sort:v.sort||'', dir:v.dir||''};
    Object.keys(v.filters||{}).forEach(function(fk){ p[fk] = v.filters[fk] });
    out[k] = p;
  });
  return out;
}
var saveT = 0;
function savePrefs(){
  clearTimeout(saveT);
  saveT = setTimeout(function(){ api('/api/prefs', prefPayload()).catch(function(){}) }, 350);
}
var SRK = ''; // 上次搜索结果的指纹，内容一样就不重建 DOM
async function searchNow(){
  if(tab==='files'){ filesNow(); return; }
  var my = ++searchSeq;
  try{
    var d = await api('/api/search?'+prefQS());
    if(my !== searchSeq) return;
    var k = JSON.stringify(d);
    SR = {notes:d.notes||[], todoIds:d.todoIds||null, where:d.where||{}, total:d.total||0, scanned:d.scanned||0};
    if(k === SRK){ paintStatus(); return }
    SRK = k;
  }catch(e){ SR = {notes:null, todoIds:null, where:{}, total:0, scanned:0}; SRK = '' }
  render();
}

/* ---------- 主题（R8）：CSS 变量切换 + 同步系统栏颜色 ---------- */
function themeOf(){
  var m = (S.settings && S.settings.theme) || 'light';
  if(m === 'auto')
    return (window.matchMedia && window.matchMedia('(prefers-color-scheme:dark)').matches) ? 'dark' : 'light';
  return m === 'dark' ? 'dark' : 'light';
}
function applyTheme(){
  var t = themeOf();
  document.documentElement.classList.add('theming');
  document.documentElement.setAttribute('data-theme', t);
  var mc = document.querySelector('meta[name=theme-color]');
  if(mc) mc.setAttribute('content', t === 'dark' ? '#0b0f14' : '#f5f7fb');
  if(window.Android && Android.setTheme) Android.setTheme((S.settings && S.settings.theme) || 'light');
  setTimeout(function(){ document.documentElement.classList.remove('theming') }, 240);
}
async function setTheme(mode){
  try{
    var d = await api('/api/theme', {mode:mode});
    S.settings = d.settings; curTheme = themeOf(); applyTheme(); render();
    toast('主题：' + ({light:'亮色', dark:'暗色', auto:'跟随系统'}[mode] || mode));
  }catch(e){ toast('切换失败: '+e) }
}

function $(s){return document.querySelector(s)}
function esc(s){return (s||'').replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function toast(m){var t=$('#toast');t.textContent=m;t.classList.add('on');
  clearTimeout(t._t);t._t=setTimeout(function(){t.classList.remove('on')},2200)}
async function api(path, body){
  var o = body ? {method:'POST',headers:{'Content-Type':'application/json'},
                  body:JSON.stringify(body)} : {};
  var r = await fetch(path, o);
  if(!r.ok) throw new Error('HTTP '+r.status);
  return r.json();
}
function now(){var d=new Date(),p=n=>String(n).padStart(2,'0');
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'T'+p(d.getHours())+':'+p(d.getMinutes())}
function fmtTime(iso){if(!iso)return '';var d=new Date(iso);if(isNaN(d))return iso;
  var p=n=>String(n).padStart(2,'0'), t=new Date();
  var same = d.toDateString()===t.toDateString();
  return (same?'今天':(d.getMonth()+1)+'/'+d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes())}
function srcChip(n){
  if(n.source==='share-text') return '<span class="chip">分享文字</span>';
  if(n.source==='share-image') return '<span class="chip img">分享图片</span>';
  if(n.source==='manual-image') return '<span class="chip img">图片</span>';
  return '<span class="chip">手动</span>';
}
function statusChip(n){
  if(n.status==='queued') return '<span class="chip pend"><span class="spin"></span> 排队中</span>';
  if(n.status==='parsing') return '<span class="chip pend"><span class="spin"></span> AI 解析中</span>';
  if(n.status==='done') return '<span class="chip ai">✦ AI '+(n.aiModel||'')+' · '+(n.aiMs||0)+'ms</span>';
  if(n.status==='raw') return '<span class="chip pend">仅原文</span>';
  if(n.status==='error') return '<span class="chip err">失败</span>';
  return '';
}
function todoRow(t, n, compact){
  var d='', dcls='due';
  if(t.due){
    var overdue = t.due < now(), today = t.due.slice(0,10)===now().slice(0,10);
    if(overdue && !t.done) dcls+=' over'; else if(today) dcls+=' today';
    d='<span class="'+dcls+'">'+fmtTime(t.due)+'</span>';
  }
  var extra = [];
  if(t.priority==='high') extra.push('<span class="chip err">重要</span>');
  if(t.priority==='low') extra.push('<span class="chip">低</span>');
  if(!compact && t.source==='manual') extra.push('<span class="chip">手动</span>');
  return '<div class="todo'+(t.done?' done':'')+(t.priority==='high'?' pri-high':'')+'">'
    +'<div class="cb'+(t.done?' on':'')+'" onclick="toggle(\''+n.id+'\',\''+t.id+'\')">'+(t.done?'✓':'')+'</div>'
    +'<div class="tx">'+esc(t.text)+'<small>'+d+' '+extra.join(' ')+'</small></div>'
    +(compact?'':'<button class="btn sm gh" onclick="delTodo(\''+n.id+'\',\''+t.id+'\')">✕</button>')
    +'</div>';
}
function noteCard(n, k){
  var exp = !!open[n.id];
  var body = n.content || '(无正文)';
  var h = '<div class="card" id="n'+n.id+'" style="--i:'+Math.min(k||0,8)+'">';
  h += '<div class="row between"><p class="t">'+esc(n.title || '未命名笔记')+'</p></div>';
  h += '<div class="meta">'+srcChip(n)+statusChip(n)
     + '<span>'+fmtTime(n.createdAt.toISOString?n.createdAt:n.createdAt)+'</span>'
     + (n.tags||[]).map(function(t){return '<span class="chip tag">#'+esc(t)+'</span>'}).join('')
     + '</div>';
  var w = SR.where[n.id];
  if(w && w.length) h += '<div class="hits">' + w.map(function(x){
      return '<span class="hit'+(x==='来自图片文字'?' img':'')+'">🔍 '+esc(x)+'</span>' }).join('') + '</div>';
  if(n.attachments && n.attachments.length > 1)
    h += '<div class="hits"><span class="hit">📎 ' + n.attachments.length + ' 个附件</span></div>';
  if(n.imagePath) h += '<img class="thumb" src="/img?id='+n.id+'">';
  h += '<div class="body'+(exp?'':' clamp')+'">'+esc(body)+'</div>';
  if(n.error) h += '<div class="err">'+esc(n.error)+'</div>';
  if(n.todos && n.todos.length){
    h += '<div style="margin-top:10px">'+n.todos.map(function(t){return todoRow(t,n,true)}).join('')+'</div>';
  }
  h += '<div class="acts">';
  h += '<button class="btn sm gh" onclick="expand(\''+n.id+'\')">'+(exp?'收起':'展开详情')+'</button>';
  if(n.status==='done'||n.status==='raw')
    h += '<button class="btn sm" onclick="reparse(\''+n.id+'\')">↻ 重新解析</button>';
  if(n.imagePath) h += '<button class="btn sm" onclick="reocr(\''+n.id+'\')">↻ 重新识别图片</button>';
  h += '<button class="btn sm" onclick="addTodoSheet(\''+n.id+'\')">＋ 待办</button>';
  h += '<button class="btn sm dg" onclick="delNote(\''+n.id+'\')">删除</button>';
  h += '</div></div>';
  return h;
}
function renderNotes(){
  var list = notesFiltered();
  if(!S.notes.length) return strip() + '<div class="empty"><div class="em">📥</div>还没有笔记<br>'
    + '在任何 app 里点「分享 → eNote」，文字和图片会自动变成笔记与待办</div>';
  if(!list.length) return strip() + '<div class="empty"><div class="em">🔍</div>没有符合条件的笔记<br>'
    +'<span style="font-size:12px">换个关键词，或点右上角 ⇅ 重置筛选</span></div>';
  var h = strip();
  list.forEach(function(n, k){ h += noteCard(n, k) });
  return h;
}
function notesFiltered(){
  if(SR.notes) return SR.notes; // 服务端结果（已排序）
  var p = P(), a = S.notes.filter(function(n){
    if(p.src==='image' && !/image$/.test(n.source||'')) return false;
    if(p.src==='text' && /image$/.test(n.source||'')) return false;
    if(p.status!=='all' && n.status!==p.status) return false;
    return hit([n.title, n.content, (n.tags||[]).join(' '),
                (n.todos||[]).map(function(t){return t.text}).join(' ')].join(' '));
  });
  var s = p.sort||'new';
  a.sort(function(x,y){
    if(s==='title') return (x.title||'').localeCompare(y.title||'', 'zh');
    if(s==='old') return (x.createdAt||'').localeCompare(y.createdAt||'');
    return (y.createdAt||'').localeCompare(x.createdAt||'');
  });
  return a;
}
function groupTodos(){
  var g = {'已逾期':[],'今天':[],'明天':[],'本周':[],'以后':[],'无日期':[],'已完成':[]};
  var t = new Date(), p = n=>String(n).padStart(2,'0');
  var today = now().slice(0,10);
  var weekEnd = new Date(t.getTime()+6*864e5);
  var weekEndS = weekEnd.getFullYear()+'-'+p(weekEnd.getMonth()+1)+'-'+p(weekEnd.getDate());
  S.notes.forEach(function(n){(n.todos||[]).forEach(function(x){
    var o = {t:x, n:n};
    if(x.done) g['已完成'].push(o);
    else if(!x.due) g['无日期'].push(o);
    else if(x.due < now()) g['已逾期'].push(o);
    else if(x.due.slice(0,10)===today) g['今天'].push(o);
    else if(x.due.slice(0,10)===tomorrow()) g['明天'].push(o);
    else if(x.due.slice(0,10)<=weekEndS) g['本周'].push(o);
    else g['以后'].push(o);
  })});
  return g;
}
function tomorrow(){var d=new Date(Date.now()+864e5),p=n=>String(n).padStart(2,'0');
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())}
function renderTodos(){
  var g = groupTodos(), h = strip(), icons = {'已逾期':'⚠️','今天':'🔥','明天':'📅','本周':'🗓','以后':'🌱','无日期':'📌','已完成':'✅'};
  var any = false, k = 0;
  var p = P();
  Object.keys(g).forEach(function(k0){
    if(k0==='已完成' && p.done==='open') return;
    if(k0!=='已完成' && p.done==='done') return;
    var items = g[k0].filter(function(o){
      if(SR.todoIds) return SR.todoIds[o.n.id+'|'+o.t.id];
      if(p.pri!=='all' && (o.t.priority||'normal')!==p.pri) return false;
      return hit([o.t.text, o.n.title, o.n.content].join(' '));
    });
    if(!items.length) return; any = true;
    if(p.sort==='pri') items.sort(function(a,b){return rank(b.t)-rank(a.t)});
    h += '<div class="sec">'+icons[k0]+' '+k0+' · '+items.length+'</div><div class="card" style="--i:'+(k++)+'">';
    items.forEach(function(o){
      h += '<div class="todo'+(o.t.done?' done':'')+(o.t.priority==='high'?' pri-high':'')+'">'
        +'<div class="cb'+(o.t.done?' on':'')+'" onclick="toggle(\''+o.n.id+'\',\''+o.t.id+'\')">'+(o.t.done?'✓':'')+'</div>'
        +'<div class="tx">'+esc(o.t.text)
        +'<small>'+(o.t.due?'<span class="due'+(o.t.due<now()&&!o.t.done?' over':'')+'">'+fmtTime(o.t.due)+'</span> ':'')
        +'<a href="#" onclick="jump(\''+o.n.id+'\');return false">'+esc(o.n.title||'查看笔记')+'</a></small></div></div>';
    });
    h += '</div>';
  });
  if(!any) return h + '<div class="empty"><div class="em">🎉</div>没有符合条件的待办<br>'
    +'分享一段文字，AI 会自动提取待办</div>';
  return h;
}
function rank(t){ return ({high:3,normal:2,low:1})[t.priority||'normal'] }
function hit(s){ if(!q) return true; return (s||'').toLowerCase().indexOf(q.toLowerCase())>=0 }

function render(){
  $('#view').innerHTML = tab==='notes' ? renderNotes()
                     : tab==='todos' ? renderTodos()
                     : tab==='files' ? renderFiles() : renderMine();
  paintStatus();
}
function strip(){
  var i = S.info;
  return '<div class="strip">待办 <b>'+(i.open||0)+'</b> · 逾期 <i>'+(i.overdue||0)+'</i>'
    +'<span class="sp"></span>'+(i.notes||0)+' 条笔记 · OCR '+(i.ocrReady?'✓':'…')+'</div>';
}
function paintStatus(){
  var i = S.info, d = $('#dot');
  if(!d) return;
  d.className = 'dot' + ((i.server && i.ocrReady) ? '' : ' bad');
}
/* ---------- 附件页（R4）----------
   数据来自 /api/attachments（服务端过滤/排序，含磁盘文件数校验）。 */
var FA = {items:[], total:0, bytes:0, files:0, missing:0, scanned:0, diskFiles:0, loaded:false};
var KIND = {image:'🖼',pdf:'📕',doc:'📄',sheet:'📊',slides:'📽',text:'📝',audio:'🎵',video:'🎬',archive:'🗜',file:'📎'};
function fmtSize(b){
  b = b||0;
  if(b >= 1048576) return (b/1048576).toFixed(1)+' MB';
  if(b >= 1024) return Math.round(b/1024)+' KB';
  return b+' B';
}
async function filesNow(){
  var my = ++searchSeq, p = P();
  var s = 'q='+encodeURIComponent(q)+'&sort='+encodeURIComponent(p.sort||'new');
  if(p.dir) s += '&dir='+encodeURIComponent(p.dir);
  if(p.kind && p.kind!=='all') s += '&mime='+encodeURIComponent(p.kind);
  try{
    var d = await api('/api/attachments?'+s);
    if(my !== searchSeq) return;
    var k = JSON.stringify(d);
    FA = {items:d.items||[], total:d.total||0, bytes:d.bytes||0, files:d.files||0,
          missing:d.missing||0, scanned:d.scanned||0, diskFiles:d.diskFiles||0, loaded:true};
    if(k === SRK){ paintStatus(); return }
    SRK = k;
  }catch(e){ FA.loaded = false; SRK = '' }
  render();
}
function fileStrip(){
  if(!FA.total) return '<div class="strip">附件 <b>0</b></div>';
  return '<div class="strip">附件 <b>'+FA.total+'</b> · '+fmtSize(FA.bytes)
    + (FA.missing ? ' · <i>'+FA.missing+' 个文件缺失</i>' : '')
    + '</div>';
}
function renderFiles(){
  if(!FA.loaded) return fileStrip() + '<div class="card"><div class="skel img"></div>'
    + '<div class="skel l"></div><div class="skel s"></div></div>';
  if(!FA.items.length) return fileStrip() + '<div class="empty"><div class="em">📎</div>'
    + (q ? '没有匹配的附件' : '还没有附件')
    + '<br><span style="font-size:12px">分享图片 / PDF，或点右下角「添加附件」</span></div>';
  var h = fileStrip() + '<div class="agrid">';
  FA.items.forEach(function(a, k){
    h += '<div class="acard'+(a.missing?' gone':'')+'" style="--i:'+Math.min(k,8)+'" '
      + 'onclick="openAttach(\''+a.id+'\')">'
      + (a.kind==='image' && !a.missing
          ? '<img class="athumb" loading="lazy" src="/file?id='+a.id+'">'
          : '<div class="aglyph">'+(KIND[a.kind]||'📎')+'</div>')
      + '<div class="aname">'+esc(a.name)+'</div>'
      + '<div class="ameta">'+esc(a.kind)+' · '+fmtSize(a.size)+' · '+fmtTime(a.createdAt)+'</div>'
      + '<div class="anote">'+esc(a.noteTitle||'')+'</div>'
      + (a.missing ? '<div class="amiss">文件已不在</div>' : '')
      + '<div class="arow" onclick="event.stopPropagation()">'
      + '<button class="btn sm gh" onclick="jump(\''+a.noteId+'\')">笔记</button>'
      + '<button class="btn sm dg" onclick="delAttach(\''+a.id+'\')">删除</button>'
      + '</div></div>';
  });
  return h + '</div>';
}
function openAttach(id){
  var a = null;
  FA.items.forEach(function(x){ if(x.id===id) a = x });
  toast('预览即将上线' + (a ? '：' + a.name : ''));
}
async function delAttach(id){
  var a = null;
  FA.items.forEach(function(x){ if(x.id===id) a = x });
  if(!confirm('删除附件' + (a ? '「'+a.name+'」' : '') + '？文件会从存储中删除。')) return;
  try{
    var r = await api('/api/attach/delete', {id:id});
    toast(r.ok ? '已删除' : ('删除失败: ' + (r.error||'')));
  }catch(e){ toast('删除失败: '+e) }
  filesNow(); refresh();
}
function pickFile(){
  if(!window.Android){ toast('文件选择只在 app 内可用'); return; }
  Android.pickFile();
  setTimeout(function(){ filesNow() }, 2500);
  setTimeout(function(){ filesNow() }, 8000);
}

function renderMine(){
  var i = S.info, s = S.settings;
  var themeName = {light:'亮色', dark:'暗色', auto:'跟随系统'}[s.theme||'light'];
  var h = '<div class="hero"><span class="ring"></span><span class="ring2"></span>'
    +'<h1>eNote</h1><p>分享即笔记 · 本机离线 OCR · 自带大模型（BYOK）</p></div>';
  h += '<div class="statgrid">'
    + stat(0, i.notes||0, '笔记') + stat(1, i.todos||0, '待办') + stat(2, i.open||0, '未完成')
    + stat(3, i.overdue||0, '已逾期') + stat(4, i.queue||0, '待解析')
    + stat(5, i.ocrReady?'✓':'…', 'OCR 引擎') + '</div>';
  h += '<div class="card" style="padding:2px 12px">'
    + li('🎨','外观主题', themeName, 'themeSheet()')
    + li('⚙️','设置','AI 模型 / 运行状态 / 用法', 'settingsSheet()')
    + li('📤','导出 JSON','全量备份笔记', "location.href='/api/export'")
    + li('📜','运行日志','', 'showLog()')
    + li('✨','AI 调用记录','', 'showDebug()')
    + '</div>';
  h += '<div class="card"><div class="kv"><span>Go 服务</span><span>'+(i.server||'')+'</span></div>'
    +'<div class="kv"><span>Go / 运行时长</span><span>'+(i.go||'')+' / '+(i.uptimeS||0)+'s</span></div></div>';
  return h;
}
function stat(i, v, label){
  return '<div class="stat" style="--i:'+i+'"><b>'+v+'</b><span>'+label+'</span></div>';
}
function li(ic, t, sub, fn){
  return '<div class="li" onclick="'+fn+'"><span style="font-size:19px">'+ic+'</span>'
    +'<div style="flex:1"><b style="font-size:14.5px">'+t+'</b>'
    +(sub?'<div style="font-size:11px;color:var(--dim2);margin-top:1px">'+sub+'</div>':'')+'</div>'
    +'<span style="color:var(--dim2)">›</span></div>';
}
function themeSheet(){
  var cur = S.settings.theme||'light';
  sheet('<h2>外观主题</h2><div class="seg" style="margin-top:10px">'
    + ['light','dark','auto'].map(function(m){
        return '<button class="'+(m===cur?'on':'')+'" onclick="setTheme(\''+m+'\');themeSheet()">'
          + ({light:'☀️ 亮色', dark:'🌙 暗色', auto:'🌗 跟随系统'}[m]) + '</button>'}).join('')
    +'</div><div style="font-size:11px;color:var(--dim);margin-top:10px">默认亮色；' 
    +'选「跟随系统」时随手机夜间模式切换，状态栏颜色同步变化。</div>', true);
}
function settingsSheet(){ sheet(renderSettings(), true); }
/* ---------- 排序 / 筛选浮层（R3，P3 接服务端）---------- */
function sortSheet(){
  var p = P(), h = '<h2>排序与筛选</h2><div style="height:6px"></div>';
  var sorts = tab==='todos'
    ? [['due','⏰ 按到期'],['pri','❗ 重要优先'],['new','🕐 最新']]
    : tab==='files' ? [['new','🕐 最新'],['size','📏 大小'],['name','🔤 名称'],['kind','🗂 类型']]
      : [['new','🕐 最新在前'],['old','🕐 最早在前'],['title','🔤 标题']];
  h += group('排序', 'sort', sorts, p.sort);
  if(tab==='notes'){
    h += group('来源', 'src', [['all','全部'],['text','文字'],['image','图片']], p.src);
    h += group('状态', 'status', [['all','全部'],['done','已解析'],['raw','仅原文'],['error','失败']], p.status);
    h += group('附件', 'file', [['all','全部'],['yes','有附件'],['no','无附件']], p.file);
  }else if(tab==='todos'){
    h += group('状态', 'done', [['open','未完成'],['done','已完成'],['all','全部']], p.done);
    h += group('优先级', 'pri', [['all','全部'],['high','重要'],['normal','普通'],['low','低']], p.pri);
  }else if(tab==='files'){
    // the server knows more kinds (slides/audio/video/archive); the common ones keep the row readable
    h += group('类型', 'kind', [['all','全部'],['image','图片'],['pdf','PDF'],['doc','文档'],
      ['sheet','表格'],['text','文本'],['file','其他']], p.kind);
  }
  h += '<div class="acts"><button class="btn" onclick="resetPrefs()">重置</button>'
     + '<button class="btn pri" onclick="closeSheet()">完成</button></div>';
  sheet(h);
}
function group(label, key, opts, cur){
  return '<label>'+label+'</label><div class="seg">'
    + opts.map(function(o){
        return '<button class="'+(o[0]===cur?'on':'')+'" onclick="setPref(\''+key+'\',\''+o[0]+'\')">'+o[1]+'</button>'
      }).join('') + '</div>';
}
function setPref(k, v){ P()[k] = v; closeSheet(); searchNow(); savePrefs(); }
function resetPrefs(){
  prefs[tab] = tab==='todos' ? {sort:'due',done:'open',pri:'all'}
             : tab==='files' ? {sort:'new',kind:'all'} : {sort:'new',src:'all',status:'all',file:'all'};
  q = ''; var el = $('#q'); if(el){ el.value=''; $('#searchBox').classList.remove('has'); }
  closeSheet(); searchNow(); savePrefs();
}
/* ---------- 轮询：只在数据真的变了才重绘（避免秒级闪烁 ----------
   2s 一次的 /api/state 很便宜，但 render() 要重建整个列表、重载缩略图、
   重播入场动画。所以先比指纹，没变就只刷新右上角状态点。 */
var SIG = '', drawn = false;
function sigOf(d){
  var ns = (d && d.notes) || [], i = (d && d.info) || {}, h = 0, k, j, s;
  for(k = 0; k < ns.length; k++){
    var n = ns[k];
    s = (n.id||'') + (n.status||'') + (n.updatedAt||'') + (n.title||'') +
        (n.todos ? n.todos.length : 0) + (n.attachments ? n.attachments.length : 0);
    for(j = 0; j < s.length; j++) h = (h*31 + s.charCodeAt(j)) | 0;
  }
  return [ns.length, h, i.todos, i.open, i.overdue, i.queue, i.ocrReady?1:0,
          (d && d.settings && d.settings.theme) || ''].join('|');
}
async function refresh(quiet){
  try{ var d = await api('/api/state'); S = d;
       var dirty = !quiet || !drawn || sigOf(d) !== SIG;
       if(!prefsLoaded && S.settings && S.settings.ui){
         prefsLoaded = true;
         var fp = flattenPrefs(S.settings.ui);
         Object.keys(fp).forEach(function(k){
           prefs[k] = Object.assign(prefs[k]||{}, fp[k]);
         });
         q = P().q || '';
         var el = $('#q'); el.value = q; $('#searchBox').classList.toggle('has', !!q);
         dirty = true;
       }
       if(themeOf() !== curTheme){ curTheme = themeOf(); applyTheme(); dirty = true; }
       paintStatus();
       if(!dirty) return;
       SIG = sigOf(d); drawn = true;
       searchNow(); }
  catch(e){ var d = $('#dot'); if(d) d.className='dot bad'; if(!drawn) render(); }
}
function expand(id){ open[id]=!open[id]; render(); }
async function toggle(nid,tid){ await api('/api/todo',{action:'toggle',noteId:nid,todoId:tid}); refresh(); }
async function delTodo(nid,tid){ await api('/api/todo',{action:'delete',noteId:nid,todoId:tid}); refresh(); }
async function reparse(id){ if(busy[id])return; busy[id]=1; toast('AI 重新解析中…');
  await api('/api/reparse',{id:id}); setTimeout(refresh,600); setTimeout(refresh,4000); }
async function delNote(id){ if(!confirm('删除这条笔记？'))return;
  await api('/api/delete',{id:id}); toast('已删除'); refresh(); }
function reocr(id){ if(!window.Android){toast('图片识别只在 app 内可用');return;}
  toast('正在识别图片…'); Android.reocr(id); setTimeout(refresh,1500); setTimeout(refresh,5000); }
function jump(id){ tab='notes'; open[id]=true; setTab(); refresh();
  setTimeout(function(){var el=document.getElementById('n'+id);if(el)el.scrollIntoView({behavior:'smooth',block:'center'})},250); }
function toggleAI(el){ var s=S.settings; s.useAI=!s.useAI; el.classList.toggle('on'); saveSettings(); }
async function saveSettings(){
  var s = {baseUrl:$('#sUrl').value.trim(), apiKey:$('#sKey').value.trim(),
    model:$('#sModel').value.trim(), timeoutS:parseInt($('#sTimeout').value)||90,
    maxTokens:parseInt($('#sMax').value)||2048, useAI:S.settings.useAI,
    temperature:S.settings.temperature||0.2};
  var r = await api('/api/settings', s);
  toast(r.ok?'已保存':'保存失败'); if(r.ok){S.settings=r.settings; render();}
}
async function testLLM(){
  $('#llmOut').innerHTML='<div class="body"><span class="spin"></span> 连接中…</div>';
  var r = await api('/api/llm/test',{});
  $('#llmOut').innerHTML='<div class="body" style="margin-top:10px">'
    +(r.ok?'✅ 成功（'+r.ms+'ms，HTTP '+r.httpCode+'）<br>'+esc(r.reply)
           :'❌ 失败（'+(r.ms||0)+'ms）<br>'+esc(r.error||''))+'</div>';
}
async function showLog(){
  var r = await api('/api/log?n=150');
  sheet('<h2>运行日志</h2><div class="meta"><span class="chip">OCR '+(r.ocrReady?'ready':'…')
    +'</span><span class="chip">'+esc(r.server||'')+'</span></div><pre>'+esc(r.log)+'</pre>');
}
async function showDebug(){
  var r = await api('/api/llmlog');
  var h='<h2>AI 调用记录</h2>';
  if(!r.calls.length) h+='<div class="empty">还没有调用记录</div>';
  r.calls.slice(0,10).forEach(function(c){
    h+='<div class="card"><div class="meta"><span class="chip">'+esc(c.model)+'</span>'
     +'<span class="chip">'+c.ms+'ms</span><span class="chip">HTTP '+c.httpCode+'</span></div>'
     +'<div class="body" style="font-size:12px">输入：'+esc(clip(c.user,200))+'</div>'
     +'<pre>'+esc(c.err?('错误：'+c.err):c.raw)+'</pre></div>';
  });
  sheet(h);
}
function clip(s,n){s=s||'';return s.length>n?s.slice(0,n)+'…':s}
function sheet(html, full){
  $('#panel').className = 'panel' + (full?' full':'');
  $('#panel').innerHTML = '<div class="grip"></div>' + html;
  $('#sheet').classList.add('on');
}
function closeSheet(){
  var s = $('#sheet');
  if(!s.classList.contains('on')) return;
  s.classList.add('closing');
  setTimeout(function(){ s.classList.remove('on'); s.classList.remove('closing'); }, 110);
}
$('#sheet').addEventListener('click', function(e){ if(e.target.id==='sheet') closeSheet(); });
function addSheet(){
  sheet('<h2>记一笔</h2>'
   +'<label>文字</label><textarea id="addText" placeholder="随手记，或粘贴一段内容。含时间/任务的句子会被自动提取成待办"></textarea>'
   +'<div class="acts"><button class="btn pri" onclick="addNote()">保存并解析</button>'
   +'<button class="btn" onclick="pickImage()">📷 选图片（本机 OCR）</button></div>');
}
async function addNote(){
  var t = $('#addText').value.trim(); if(!t){toast('写点内容吧');return;}
  closeSheet(); toast('已加入队列…');
  var r = await api('/api/add',{text:t});
  if(!r.ok) toast(r.error||'失败');
  setTimeout(refresh,500); setTimeout(refresh,3000); setTimeout(refresh,9000);
}
function pickImage(){
  if(!window.Android){toast('选图只在 app 内可用');return;}
  Android.pickImage(); closeSheet(); toast('已提交，正在识别图片…');
  setTimeout(refresh,1500); setTimeout(refresh,5000); setTimeout(refresh,12000);
}
function addTodoSheet(nid){
  sheet('<h2>添加待办</h2><label>事项</label><input id="tText" placeholder="要做什么">'
   +'<div class="grid2"><div><label>日期</label><input type="date" id="tDate"></div>'
   +'<div><label>时间</label><input type="time" id="tTime"></div></div>'
   +'<label>优先级</label><select id="tPri"><option value="normal">普通</option>'
   +'<option value="high">重要</option><option value="low">低</option></select>'
   +'<div class="acts"><button class="btn pri" onclick="addTodo(\''+nid+'\')">添加</button></div>');
}
async function addTodo(nid){
  var t=$('#tText').value.trim(); if(!t){toast('写点内容吧');return;}
  var due = $('#tDate').value ? $('#tDate').value+'T'+($('#tTime').value||'09:00') : '';
  var r = await api('/api/todo',{action:'add',noteId:nid,text:t,due:due,priority:$('#tPri').value});
  closeSheet(); toast(r.ok?'已添加':'失败'); refresh();
}
function setTab(anim){
  tab = tab || 'notes';
  document.querySelectorAll('.tabbar .tab').forEach(function(b){
    b.classList.toggle('on', b.dataset.tab===tab)});
  moveInd();
  var mine = tab==='mine';
  $('#topbar').style.display = mine ? 'none' : 'flex';
  var f = FABS[tab], fab = $('#fab');
  if(f){
    fab.classList.remove('hide');
    fab.querySelector('.fico').textContent = f.ico;
    fab.querySelector('.flabel').textContent = f.label;
    fab.onclick = f.fn;
  } else fab.classList.add('hide');
  $('#q').placeholder = tab==='todos' ? '搜索待办' : tab==='files' ? '搜索附件' : '搜索笔记与待办';
  q = P().q || '';
  var qi = $('#q'); qi.value = q; $('#searchBox').classList.toggle('has', !!q);
  var v = $('#view');
  v.classList.remove('enter');
  clearTimeout(enterT);
  if(anim !== false){
    void v.offsetWidth; v.classList.add('enter');
    // 入场动画只属于切页：不摘掉 enter，每次轮询重绘都会重播一遍
    enterT = setTimeout(function(){ v.classList.remove('enter') }, 520);
  }
  render();
  searchNow();
}
var enterT = 0;
function moveInd(){
  var el = document.querySelector('.tabbar .tab.on'), ind = $('#ind');
  if(!el || !ind) return;
  ind.style.width = Math.round(el.offsetWidth*0.46)+'px';
  ind.style.transform = 'translateX('+(el.offsetLeft + el.offsetWidth*0.27)+'px)';
}
var FABS = {
  notes:{ico:'＋', label:'记一笔', fn:function(){ addSheet() }},
  todos:{ico:'＋', label:'记待办', fn:function(){ addSheet() }},
  files:{ico:'📎', label:'添加附件', fn:function(){ pickFile() }},
  mine:null
};
/* 涟漪（R10）：一个监听器给所有按钮类组件 */
document.addEventListener('pointerdown', function(e){
  var el = e.target.closest ? e.target.closest('.btn,.iconbtn,.tab,.fab,.seg button,.li') : null;
  if(!el) return;
  var r = el.getBoundingClientRect(), d = Math.max(r.width, r.height);
  var s = document.createElement('span');
  s.className = 'rip';
  s.style.width = s.style.height = d+'px';
  s.style.left = (e.clientX - r.left - d/2)+'px';
  s.style.top  = (e.clientY - r.top  - d/2)+'px';
  el.appendChild(s);
  setTimeout(function(){ if(s.parentNode) s.parentNode.removeChild(s) }, 320);
});
document.querySelectorAll('.tabbar .tab').forEach(function(b){
  b.onclick = function(){ if(tab===b.dataset.tab){ window.scrollTo({top:0,behavior:'smooth'}); return; }
    tab = b.dataset.tab; setTab(); window.scrollTo(0,0); }});
$('#brandBtn').onclick = function(){ tab='mine'; setTab(); window.scrollTo(0,0); };
$('#sortBtn').onclick = sortSheet;
var searchT = 0;
$('#q').addEventListener('input', function(){
  q = this.value.trim();
  P().q = q;
  $('#searchBox').classList.toggle('has', !!q);
  // 服务端搜索：等用户停手再发，避免每敲一个字就重建一次列表
  clearTimeout(searchT);
  searchT = setTimeout(function(){ searchNow(); savePrefs(); }, 260);
});
$('#qClear').onclick = function(){ q=''; this.blur(); var el=$('#q'); el.value='';
  $('#searchBox').classList.remove('has'); P().q=''; clearTimeout(searchT); searchNow(); savePrefs(); };
window.addEventListener('resize', moveInd);
// 安静轮询：数据没变就只刷状态点，不重建 DOM
setInterval(function(){ if(!document.hidden) refresh(true); }, 2000);
refresh();
setTab();
</script>
</body>
</html>
